name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Parsern och latchlogiken importerar ingenting från Home Assistant,
      # så testerna behöver varken beroenden eller en HA-installation.
      - name: Kör tester
        run: |
          python3 tests/test_parser.py
          python3 tests/test_runtime.py

      - name: Syntaxkontroll
        run: python3 -m compileall -q custom_components

      - name: Manifestversion matchar taggen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/bfour_ble/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "Taggen är $tag men manifestet säger $manifest"
            exit 1
          fi
